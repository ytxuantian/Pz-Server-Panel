<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>PZ Server Panel - 登录</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <svg viewBox="0 0 48 48" width="64" height="64">
                        <rect x="8" y="8" width="32" height="32" rx="4" fill="none" stroke="#c0392b" stroke-width="2"/>
                        <path d="M24 14 L24 34" stroke="#c0392b" stroke-width="2"/>
                        <path d="M14 24 L34 24" stroke="#c0392b" stroke-width="2"/>
                        <circle cx="24" cy="24" r="4" fill="#c0392b"/>
                    </svg>
                </div>
                <h1>PZ Server Panel</h1>
                <p class="login-subtitle">Project Zomboid 服务器管理面板</p>
            </div>
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" placeholder="请输入管理员用户名" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" placeholder="请输入密码" required autocomplete="current-password">
                </div>
                <div class="form-group">
                    <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
                        <span class="btn-text">登 录</span>
                        <span class="btn-loading" style="display:none;">
                            <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="31.4 31.4" stroke-linecap="round" class="spinner"/></svg>
                            登录中...
                        </span>
                    </button>
                </div>
                <div class="form-group">
                    <div id="loginError" class="error-message" style="display:none;"></div>
                </div>
            </form>
            <div class="login-footer">
                <p>PZ Server Panel v1.0.0</p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('loginError');
            
            if (!username || !password) {
                errorDiv.textContent = '请输入用户名和密码';
                errorDiv.style.display = 'block';
                return;
            }

            loginBtn.disabled = true;
            loginBtn.querySelector('.btn-text').style.display = 'none';
            loginBtn.querySelector('.btn-loading').style.display = 'inline-flex';
            errorDiv.style.display = 'none';

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.result === 1) {
                    sessionStorage.setItem('sessionKey', data.session_key);
                    sessionStorage.setItem('username', username);
                    window.location.href = '/';
                } else {
                    errorDiv.textContent = data.message || '登录失败';
                    errorDiv.style.display = 'block';
                    loginBtn.disabled = false;
                    loginBtn.querySelector('.btn-text').style.display = 'inline';
                    loginBtn.querySelector('.btn-loading').style.display = 'none';
                }
            })
            .catch(err => {
                errorDiv.textContent = '网络错误，请检查服务器连接';
                errorDiv.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.querySelector('.btn-text').style.display = 'inline';
                loginBtn.querySelector('.btn-loading').style.display = 'none';
            });
        });

        // Enter key support
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
